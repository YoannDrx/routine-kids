name: RoutineKids
options:
  bundleIdPrefix: com.yoannandrieux
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ROUTINEKIDS_API_BASE_URL: https://routine-kids.vercel.app
    APPLE_MONTHLY_PRODUCT_ID: com.yoannandrieux.routinekids.familyplus.monthly
    APPLE_YEARLY_PRODUCT_ID: com.yoannandrieux.routinekids.familyplus.yearly
targets:
  RoutineKids:
    type: application
    platform: iOS
    sources:
      - path: RoutineKids
    info:
      path: RoutineKids/Info.plist
      properties:
        CFBundleDisplayName: RoutineKids
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSPhotoLibraryUsageDescription: RoutineKids utilise une photo choisie par le parent pour personnaliser le profil enfant.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ROUTINEKIDS_API_BASE_URL: $(ROUTINEKIDS_API_BASE_URL)
        APPLE_MONTHLY_PRODUCT_ID: $(APPLE_MONTHLY_PRODUCT_ID)
        APPLE_YEARLY_PRODUCT_ID: $(APPLE_YEARLY_PRODUCT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoannandrieux.routinekids
        PRODUCT_NAME: RoutineKids
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - RoutineKidsTests
  RoutineKidsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoutineKidsTests
    dependencies:
      - target: RoutineKids
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yoannandrieux.routinekids.tests
