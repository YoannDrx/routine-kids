name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: routinekids
          POSTGRES_PASSWORD: routinekids
          POSTGRES_USER: routinekids
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routinekids -d routinekids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: RoutineKids CI <ci@example.com>
      DATABASE_URL: postgresql://routinekids:routinekids@127.0.0.1:5432/routinekids
      DIRECT_URL: postgresql://routinekids:routinekids@127.0.0.1:5432/routinekids
      E2E_AUTHENTICATED: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:git-target
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  verify-production-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/verify-vercel-production.mjs
